name: Dependabot auto-merge

# Turns on GitHub auto-merge for Dependabot PRs that are patch or minor bumps.
# The PR only actually merges once the required "build" check passes, so a
# bump that breaks the build just sits there open instead of landing.
# Major version bumps are never auto-merged.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge (patch/minor only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
